<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="sms1.site - 企业级国际短信网关系统（SMSC），可私有化部署、源码级交付。智能路由、三级计费、全球合规 Sender ID、Telegram 深度集成。" />
    <meta name="apple-mobile-web-app-title" content="sms1.site" />
    <meta name="application-name" content="sms1.site" />
    <!-- 社交分享卡片（Open Graph / Twitter） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sms1.site" />
    <meta property="og:title" content="sms1.site - 企业级国际短信网关系统" />
    <meta property="og:description" content="可私有化部署、源码级交付的企业级国际短信网关：智能路由、三级计费、全球合规 Sender ID、Telegram 深度集成。" />
    <meta property="og:url" content="https://sms1.site/" />
    <meta property="og:image" content="https://sms1.site/favicon.svg?v=sms1" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="sms1.site - 企业级国际短信网关系统" />
    <meta name="twitter:description" content="可私有化部署、源码级交付的企业级国际短信网关。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=sms1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>sms1.site - 企业级国际短信网关系统 | 私有化部署 · 源码级交付</title>
    <!-- 主题早绑定：首屏渲染前确定 data-theme（已存偏好 > 跟随系统），消除明暗闪烁 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            localStorage.setItem('theme', t);
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      /* 防止加载时闪烁 - 预加载背景随主题 */
      html, body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #070b16; color: #eaf0ff; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eef2f8; color: #0a1425; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
